name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            blog/hello-world/index.html
            blog/fantastic-graphql-bugs-and-where-to-find-them/index.html
            blog/algolia-api-key-misconfiguration-in-vite/index.html
            blog/github-actions-command-injection-hangul/index.html
            blog/self-xss-in-stirling-pdf-cve-2024-52286/index.html
            blog/automating-portainer-hosted-teslamate-backups-to-google-drive/index.html
            posts/index.html
            portfolio/index.html
            feed.xml
            404.html
            _redirects
            pagefind/pagefind.js
            .well-known/appspecific/com.tesla.3p.public-key.pem
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ -f "dist/$f" ]; then
              echo "ok      dist/$f"
            else
              echo "::error::missing dist/$f"
              missing=1
            fi
          done
          cmp public/.well-known/appspecific/com.tesla.3p.public-key.pem \
              dist/.well-known/appspecific/com.tesla.3p.public-key.pem
          exit "$missing"
